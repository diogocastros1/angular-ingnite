<div class="overflow-x-auto rounded-lg border border-[var(--color-border)] bg-white">
  <table class="min-w-full border-collapse text-left text-sm">
    <thead class="bg-[var(--color-surface-secondary)]">
      <tr>
        @for (column of columns; track column) {
          <th class="px-3 py-2 font-semibold capitalize">{{ column }}</th>
        }
        <th class="px-3 py-2 font-semibold">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track trackById($index, row)) {
        <tr class="border-t border-[var(--color-border)]">
          <td class="px-3 py-2">{{ row.id }}</td>
          <td class="px-3 py-2">{{ row.name }}</td>
          <td class="px-3 py-2">{{ row.sku }}</td>
          <td class="px-3 py-2">{{ row.price | currency }}</td>
          <td class="px-3 py-2">{{ row.active ? 'Yes' : 'No' }}</td>
          <td class="px-3 py-2">
            <div class="flex gap-2">
              <button mat-stroked-button type="button" (click)="editRow.emit(row)">Edit</button>
              <button mat-stroked-button type="button" (click)="deleteRow.emit(row)">Delete</button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td class="px-3 py-3 text-[var(--color-muted)]" colspan="6">No records found.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
