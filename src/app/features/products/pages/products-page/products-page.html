<section class="grid gap-6 lg:grid-cols-[1fr,22rem]">
  <article class="grid gap-4">
    <div class="flex items-center justify-between gap-3">
      <h1 class="text-xl font-semibold">Products</h1>
      <input
        class="w-60 rounded-md border border-[var(--color-border)] px-3 py-2"
        type="search"
        [formControl]="filterControl"
        placeholder="Search by name or SKU"
      />
    </div>

    @if (loading()) {
      <p class="text-sm text-[var(--color-muted)]">Loading data...</p>
    }

    @if (error()) {
      <p class="rounded-md border border-red-300 bg-red-50 p-3 text-red-600">{{ error() }}</p>
    }

    <app-data-table
      [columns]="columns"
      [rows]="products()"
      (editRow)="edit($event)"
      (deleteRow)="remove($event)"
    />
  </article>

  <app-product-form
    [editingProduct]="editingProduct()"
    (save)="onSave($event)"
    (cancelForm)="cancelEdit()"
  />
</section>
