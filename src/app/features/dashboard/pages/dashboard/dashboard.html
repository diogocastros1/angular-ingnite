<section class="grid gap-4 md:grid-cols-3">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Uptime</mat-card-title>
    </mat-card-header>
    <mat-card-content class="text-2xl font-semibold">{{ metrics().uptime }}</mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title>Users Online</mat-card-title>
    </mat-card-header>
    <mat-card-content class="text-2xl font-semibold">{{ metrics().usersOnline }}</mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title>Error Rate</mat-card-title>
    </mat-card-header>
    <mat-card-content class="text-2xl font-semibold">{{ metrics().errorRate }}%</mat-card-content>
  </mat-card>
</section>
